# Interface text in both languages.
#
# Every entry is an `en` / `ko` pair. Render one with:
#
#   {% include t.html key="nav.research" %}
#
# which emits both languages wrapped in <span class="lang" data-lang="...">,
# so the KOR/ENG toggle shows exactly one of them. A one-off string that does
# not belong in this file can be passed inline instead:
#
#   {% include t.html en="Alumni" ko="졸업생" %}
#
# Publication entries are deliberately NOT translated: citations are quoted
# bibliographic records and have to stay in the language they were published
# in.

# Nav labels are NOT here: a page's Korean nav label is `title_ko` in its own
# front matter, so the label lives next to the page it names.

