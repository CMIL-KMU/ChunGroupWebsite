<!-- Web font -->
<!--
  Pretendard, the same family the reference site (snu-sdcl.github.io) uses.
  It draws Latin and Hangul at matching optical weight, which matters here
  because every heading and label now carries both scripts side by side.

  Declared explicitly rather than derived from the theme file: the
  google_fonts filter replaces only the first space in a family name and
  always appends italic axes, so a multi-word family came back as an error
  and nothing loaded at all - which is why the site had been rendering in
  Arial.

  The variable dynamic-subset build is the cheap one: 53KB of CSS split
  into 92 unicode ranges, so a visitor downloads only the Hangul blocks the
  page actually uses, and one file covers every weight from 45 to 920.
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
>

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "https://use.fontawesome.com/releases/v6.7.0/css/all.css" %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
