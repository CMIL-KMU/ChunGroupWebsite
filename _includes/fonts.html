<!-- Google Fonts -->
<!--
  Declared explicitly rather than derived from the theme file. The
  google_fonts filter only replaces the first space in a family name and
  always asks for italic axes, so a family like "IBM Plex Sans KR" - which
  has no italics - came back as an error and nothing loaded.
  IBM Plex Sans KR draws Latin and Hangul as one design, so English and
  Korean match instead of Korean falling through to each OS's default.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "https://use.fontawesome.com/releases/v6.7.0/css/all.css" %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
